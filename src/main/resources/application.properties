# Configuración del Servidor
spring.application.name=campusFlow

# Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/campus_flow
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave Secreta JWT
JWT_SECRET=claveSecretaSuperSeguraParaDesarrolloLocal123456

# Configuración de Stripe (leyendo las variables de IntelliJ)
stripe.secret-key=${stripe.secret-key}
stripe.webhook-secret=${stripe.webhook-secret}
stripe.price-pago-unico=${stripe.price-pago-unico}
stripe.price-plan-individual=${stripe.price-plan-individual}
stripe.url-exito=http://localhost:8080/pago-exitoso
stripe.url-cancelado=http://localhost:8080/pago-cancelado

server.port=${PORT:8080}